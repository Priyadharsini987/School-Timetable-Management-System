# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# MySQL Database
# ==============================

spring.datasource.url=jdbc:mysql://localhost:3306/school_timetable_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Priya@2007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================
# JWT
# ==============================
# 256-bit secret used to sign tokens - change this in production
jwt.secret=school-timetable-management-system-super-secret-key-change-me-2026
jwt.expiration.ms=86400000

# ==============================
# CORS - allow the React dev server
# ==============================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ==============================
# Admin bootstrap account
# Created automatically on first run if it does not exist.
# ==============================
app.admin.email=admin@school.com
app.admin.password=Admin@123

# ==============================
# SpringDoc / Swagger UI
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none

