# Server
server.port=${SERVER_PORT:8080}

# MySQL Database - configure credentials in your local environment
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/school_timetable_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT - set a strong private JWT_SECRET in your local environment
jwt.secret=${JWT_SECRET:}
jwt.expiration.ms=86400000

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Initial admin account - configure locally
app.admin.email=${APP_ADMIN_EMAIL:admin@school.com}
app.admin.password=${APP_ADMIN_PASSWORD:}

# SpringDoc / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
